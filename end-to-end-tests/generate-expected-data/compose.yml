services:
  generate:
    build:
      context: ..
      dockerfile: generate-expected-data/generate.Dockerfile
      target: generate-tests-data
    depends_on:
      dtoserver:
        condition: service_healthy
    deploy:
      replicas: 0

  dtoserver:
    build:
      context: ../..
      target: final-host
    environment:
      - Storage__CustomRootFolder=Test/
      - SnapshotCreation__SNAPSHOTINTERVAL=5
      - CLEANUP__MINIMUMSNAPSHOTSTOKEEP=2
      - MINIOS3__ACCESSKEY=ROOTUSER
      - MINIOS3__SECRETKEY=MINIOPASSWORD
      - MINIOS3__SERVICEURL=minio:9000
      - MINIOS3__BUCKETNAME=dto-server-expected      
      - S3__ACCESSKEY=ROOTUSER
      - S3__SECRETKEY=MINIOPASSWORD
      - S3__SERVICEURL=minio:9000
      - S3__BUCKETNAME=dto-server-expected
    depends_on:
      minio:
        condition: service_healthy

  minio:
    image:
      docker.io/bitnami/minio
    volumes:
      - ./generated-minio-data:/bitnami/minio/data/
    user: "0"
    environment:
      MINIO_ROOT_USER: ROOTUSER
      MINIO_ROOT_PASSWORD: MINIOPASSWORD
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 250ms
      timeout: 1s
      retries: 10
