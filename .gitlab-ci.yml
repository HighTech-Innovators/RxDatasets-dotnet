###########################################################################################################
###########################################################################################################
###                                                                                                    ####
###                                               BUILD & TEST                                         ####
###                                                                                                    ####
###########################################################################################################
###########################################################################################################

dotnet restore:
  extends:
    - .branches_and_merge_requests
    - .docker_build_target
  variables:
    DOCKERFILE_TARGET: restore
  stage: restore

dotnet build:
  extends:
    - .branches_and_merge_requests
    - .docker_build_target
  variables:
    DOCKERFILE_TARGET: build
  stage: build
  needs:
    - dotnet restore

dotnet test:
  extends:
    - .branches_and_merge_requests
    - .docker_build_target
  variables:
    DOCKERFILE_TARGET: test
  stage: test
  needs:
    - dotnet build


e2e test:
  extends:
    - .branches_and_merge_requests
  stage: test
  needs:
    - dotnet build
  script:
    - cd end-to-end-tests
    - chmod +x ./run.sh
    - VERSION="${CI_COMMIT_TAG:-0.0.0-cibuild}" ./run.sh
  image: ${DOCKER_BUILD_IMAGE}

