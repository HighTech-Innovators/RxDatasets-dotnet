syntax = "proto3";

import "google/protobuf/timestamp.proto";

message SnapshotEntity {
	repeated uint64 last_deleted_version = 1;
	repeated uint64 last_inserted_version = 2;
	uint64 last_updated_version = 3;
	int64 position = 4;
	int32 length = 5;
	uint32 crc32 = 7;
}

// Recursive bucket for nested snapshot storage.
// Each node holds leaf entities (keyed by their segment at this level)
// and child buckets (keyed by the next path segment).
message SnapshotBucket {
	map<string, SnapshotEntity> leaves = 1;
	map<string, SnapshotBucket> children = 2;
}

message SnapshotIndex {
	uint64 snapshot_version_legacy = 1;
	map<string, SnapshotEntity> entities = 2;       // flat format (legacy)
	SnapshotBucket nested = 33;                      // nested trie format
	uint64 snapshot_version = 32;
	string id_pattern = 34;                          // when set, entity names in nested/entities are compressed (fixed segments stripped)
}

message DeltaEntity {
	string name = 1;
	int64 position = 2;
	int32 length = 3;
	uint32 crc32 = 5;
	uint64 previous_version = 6;
	string tracking_id = 7;
	google.protobuf.Timestamp sla_timestamp = 8;
}

message DeletedEntity {
	string name = 1;
	uint64 previous_version = 2;
	string tracking_id = 3;
	google.protobuf.Timestamp sla_timestamp = 4;
}

// Recursive bucket for nested delta storage.
// Entity name fields store only the leaf segment; the full name
// is reconstructed by concatenating the path from root to leaf.
message DeltaBucket {
	repeated DeltaEntity new_entities = 1;
	repeated DeltaEntity changed_entities = 2;
	repeated DeletedEntity deleted_entities = 3;
	repeated string deleted_names = 4;
	map<string, DeltaBucket> children = 5;
}

message DeltaIndex {
	uint64 delta_version_legacy = 1;
	repeated string deleted_names = 2; // Obsolete - no previous version
	repeated DeltaEntity changed_entities = 3;
	repeated DeltaEntity new_entities = 4;
  google.protobuf.Timestamp timestamp = 5;
  repeated DeletedEntity deleted_entities = 6;
	DeltaBucket nested = 33;                         // nested trie format
	uint64 delta_version = 32;
	string id_pattern = 34;                          // when set, entity names are compressed (fixed segments stripped)
}

message ProcessedVersionsInfo {
	map<string, uint64> processed_versions = 1;
}

message DeltaInfo {
	uint64 earliest_delta_version = 1;
	uint64 latest_delta_version = 2;
}

message SnapshotInfo {
	repeated snapshotVersion snapshot_versions = 1;
	message snapshotVersion {
		uint64 version = 1;
		google.protobuf.Timestamp timestamp = 2;
	}
}
