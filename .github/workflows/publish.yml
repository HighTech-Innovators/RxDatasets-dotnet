# Publishes the NuGet packages to nuget.org with Trusted Publishing (OIDC, no long-lived API key).
# This GitHub repo is a push mirror of https://gitlab.developer.htiprojects.nl/oss/rxdatasets/RxDatasets-dotnet, which is the
# source of truth: change this file there. Tags (the package version) are created by the GitLab tag pipelines.
#
# The mirror pushes a tag as soon as it lands on GitLab, before the GitLab tag pipeline has tested it, so this workflow
# runs the same unit and end-to-end tests itself and only publishes when they pass. On develop it runs the tests only.
name: publish

on:
  push:
    branches: [develop]
    tags: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # Testcontainers-based provider tests (Minio, S3, ...) use the runner's Docker daemon.
      - name: Unit tests
        run: dotnet test RxDatasets.sln -c Release

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: End-to-end tests
        working-directory: end-to-end-tests
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '0.0.0-cibuild' }}
        run: bash ./run.sh

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # nuget.org Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - name: Build packages
        env:
          VERSION: ${{ github.ref_name }}
        run: docker buildx build --target packages --build-arg VERSION="$VERSION" --output type=local,dest=out .

      - name: NuGet login (Trusted Publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER || 'htibartdeboer' }}

      - name: Push to nuget.org
        run: dotnet nuget push out/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
