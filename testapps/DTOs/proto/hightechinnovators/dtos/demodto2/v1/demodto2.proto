syntax = "proto3";

package hightechinnovators.dtos.demodto2.v1;

option java_multiple_files = true;
option java_outer_classname = "Demodto2Proto";
option java_package = "com.hightechinnovators.dtos.demodto2.v1";
option csharp_namespace = "Hightechinnovators.Dtos.Demodto2V1";

message Demodto2 {
    string name = 101;

    string some_string = 1;
    int32 some_int = 2;
    bool some_bool = 3;

    Quality some_enum = 4;

    enum Quality {
        QUALITY_UNSPECIFIED = 0;
        SD = 1;
        HD = 2;
    }
}