syntax = "proto3";

package hightechinnovators.dtos.demodto2.v1;

option java_multiple_files = true;
option java_outer_classname = "WriterServiceProto";
option java_package = "com.hightechinnovators.dtos.demodto2.v1";
option csharp_namespace = "Hightechinnovators.Dtos.Demodto2V1";

import "hightechinnovators/dtos/type/writer_service_types.proto";
import "hightechinnovators/dtos/demodto2/v1/demodto2.proto";

service WriterService {
    rpc PutAll(stream Demodto2) returns (hightechinnovators.dtos.type.WriteResponse);
    rpc PutAllChildren(stream Demodto2) returns (hightechinnovators.dtos.type.WriteResponse);
    rpc PutMany(stream Demodto2) returns (hightechinnovators.dtos.type.WriteResponse);
    rpc Put(Demodto2) returns (hightechinnovators.dtos.type.WriteResponse);
    rpc Delete(hightechinnovators.dtos.type.DeleteRequest) returns (hightechinnovators.dtos.type.WriteResponse);
    rpc PutOrDeleteMany(stream hightechinnovators.dtos.type.PutOrDelete) returns (hightechinnovators.dtos.type.WriteResponse);
}