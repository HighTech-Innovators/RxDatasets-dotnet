syntax = "proto3";

package hightechinnovators.dtos.testdto.v1;

option java_multiple_files = true;
option java_outer_classname = "TestdtoProto";
option java_package = "com.hightechinnovators.dtos.testdto.v1";
option csharp_namespace = "Hightechinnovators.Dtos.TestdtoV1";

message Testdto {
    /* minor version 0 */
    string name = 101;

    string some_string = 1;
    int32 some_int = 2;
    bool some_bool = 3;
    
    Quality some_enum = 4;

    enum Quality {
        QUALITY_UNSPECIFIED = 0;
        SD = 1;
        HD = 2;
    }
}
